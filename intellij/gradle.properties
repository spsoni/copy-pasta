# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = info.suryasoni.copy-pasta
pluginName = Copy-Pasta
pluginRepositoryUrl = https://github.com/spsoni/copy-pasta
# SemVer format -> https://semver.org
pluginVersion = 2.1.1

# Supported IDEs: 2025.3 (253) and newer, no upper bound. We compile against the LOWEST supported platform so
# newer-only APIs fail at compile time; CI's Plugin Verifier checks the newer IDEs. Raising the floor means bumping
# pluginSinceBuild, platformVersion and the Kotlin apiVersion (build.gradle.kts) together.
# -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 253
platformVersion = 2025.3.6

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 9.8.2

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# Memory tuning (2026-11-16): one JVM and bounded heap, sized for a ~3 GB build environment.
# Kotlin compiles inside the Gradle daemon (a separate Kotlin daemon was ~690 MB and lingered for hours).
kotlin.compiler.execution.strategy=in-process
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=900000
org.gradle.workers.max=2
