# Tag-based release. Pushing a tag `vX.Y.Z` (or `vX.Y.Z-beta.N`) runs this workflow:
#   1. checks the tag matches `pluginVersion` and that CHANGELOG.md has an entry for it,
#   2. runs the tests, builds and verifies the plugin against the supported IDEs,
#   3. signs the ZIP (when the signing secrets exist),
#   4. publishes to JetBrains Marketplace (when PUBLISH_TOKEN exists; pre-release labels go to that channel),
#   5. creates the GitHub release with the changelog entry as notes and the ZIP attached.
#
# Cut a release locally with `make release VERSION=X.Y.Z`, then push the commit and tag.
# Secrets: CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD (signing), PUBLISH_TOKEN (Marketplace).
# The first Marketplace upload must be manual: take the signed ZIP from the GitHub release.

name: Release
on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    env:
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Check tag, version and changelog
        id: meta
        shell: bash
        run: |
          VERSION="$(./gradlew properties --console=plain -q | grep '^version:' | cut -f2- -d ' ')"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pluginVersion $VERSION in gradle.properties"
            exit 1
          fi
          ./gradlew getChangelog --console=plain -q --project-version="$VERSION" --no-header --no-links --no-empty-sections --output-file="$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no entry for $VERSION (run 'make release VERSION=$VERSION')"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Test and build
        run: ./gradlew check buildPlugin

      - name: Setup Plugin Verifier IDEs Cache
        uses: actions/cache@v4
        with:
          path: ~/.pluginVerifier/ides
          key: plugin-verifier-${{ hashFiles('gradle.properties') }}

      - name: Verify plugin
        run: ./gradlew verifyPlugin -Dplugin.verifier.home.dir=~/.pluginVerifier

      - name: Sign plugin
        if: ${{ env.CERTIFICATE_CHAIN != '' && env.PRIVATE_KEY != '' }}
        run: ./gradlew signPlugin

      - name: Publish to JetBrains Marketplace
        if: ${{ env.PUBLISH_TOKEN != '' && env.CERTIFICATE_CHAIN != '' }}
        run: ./gradlew publishPlugin

      - name: Note skipped publishing
        if: ${{ env.PUBLISH_TOKEN == '' || env.CERTIFICATE_CHAIN == '' }}
        run: echo "::warning::Marketplace publishing skipped (signing secrets or PUBLISH_TOKEN not set). Upload the ZIP from the GitHub release manually."

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          PRERELEASE=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" build/distributions/*.zip \
            --title "Copy-Pasta ${{ steps.meta.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag $PRERELEASE
