# Tag-based release of the VS Code extension. Pushing a tag `vscode-vX.Y.Z` (cut with `make vscode-release
# VERSION=X.Y.Z`) runs this workflow:
#   1. checks the tag matches vscode/package.json and that vscode/CHANGELOG.md has an entry for it,
#   2. type-checks and tests (incl. the spec vectors) and runs the integration tests inside VS Code,
#   3. packages the .vsix and creates (or updates, on a re-run) the GitHub release with the changelog entry as notes,
#   4. publishes to the VS Code Marketplace with trusted publishing (OIDC, no stored token) and to Open VSX
#      (secret OVSX_PAT) when that secret exists.
# Marketplace trusted publishing policy (publisher spsoni): repository spsoni/copy-pasta, workflow release-vscode.yml,
# environment vscode-marketplace. Only the `marketplace` job can request an OIDC token, and it runs no project code:
# it installs the publishing tools from vscode/tools' lockfile and uploads the .vsix the `release` job built.
# The JetBrains plugin has its own release.yml with `vX.Y.Z` tags.

name: Release VS Code extension
on:
  push:
    tags: [ 'vscode-v[0-9]+.[0-9]+.[0-9]+' ]

concurrency:
  group: release-vscode
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: vscode

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      vsix: ${{ steps.package.outputs.vsix }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            vscode/package-lock.json
            vscode/tools/package-lock.json

      - name: Check tag, version and changelog
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "vscode-v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION in vscode/package.json"
            exit 1
          fi
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::vscode/CHANGELOG.md has no entry for $VERSION (run 'make vscode-release VERSION=$VERSION')"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: No runtime dependencies
        run: test "$(node -p 'Object.keys(require("./package.json").dependencies || {}).length')" = "0"

      - name: Type-check and test
        run: npm run check

      - name: Integration tests inside VS Code
        run: xvfb-run -a npm run test:integration

      - name: Package
        id: package
        run: |
          npm run package
          echo "vsix=$(ls -- *.vsix)" >> "$GITHUB_OUTPUT"

      - name: Keep the .vsix for the publish jobs
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vscode/${{ steps.package.outputs.vsix }}
          if-no-files-found: error

      # Not marked latest, so the JetBrains plugin's release stays "latest". Idempotent, so a failed publish can be re-run.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.package.outputs.vsix }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.vsix }}" \
              --title "Copy-Pasta for VS Code ${{ steps.meta.outputs.version }}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag --latest=false
          fi

  marketplace:
    name: Publish to the VS Code Marketplace
    needs: release
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch the publishing tools' lockfile
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: vscode/tools
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/tools/package-lock.json

      - name: Install the publishing tools
        run: npm --prefix tools ci --no-audit

      - name: Fetch the .vsix
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vscode/dist

      - name: Publish
        run: tools/node_modules/.bin/vsce publish --oidc --packagePath "dist/${{ needs.release.outputs.vsix }}" --skip-duplicate

  open-vsx:
    name: Publish to Open VSX
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for the token
        id: token
        env:
          HAS_OVSX: ${{ secrets.OVSX_PAT != '' }}
        run: |
          echo "present=$HAS_OVSX" >> "$GITHUB_OUTPUT"
          if [ "$HAS_OVSX" != "true" ]; then
            echo "::warning::OVSX_PAT isn't set, so the extension wasn't published to Open VSX. The .vsix is on the GitHub release."
          fi
        working-directory: .

      - name: Fetch the publishing tools' lockfile
        if: ${{ steps.token.outputs.present == 'true' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: vscode/tools
          sparse-checkout-cone-mode: false

      - name: Setup Node
        if: ${{ steps.token.outputs.present == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/tools/package-lock.json

      - name: Install the publishing tools
        if: ${{ steps.token.outputs.present == 'true' }}
        run: npm --prefix tools ci --no-audit

      - name: Fetch the .vsix
        if: ${{ steps.token.outputs.present == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vscode/dist

      - name: Publish
        if: ${{ steps.token.outputs.present == 'true' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: tools/node_modules/.bin/ovsx publish "dist/${{ needs.release.outputs.vsix }}" --skip-duplicate
