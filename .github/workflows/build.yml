# CI for pushes to main and pull requests. The four jobs run in parallel:
# - build the plugin and upload the ZIP as an artifact,
# - run `check` (ktlint + unit/platform tests + Kover report),
# - run Qodana inspections,
# - run the IntelliJ Plugin Verifier: on pull requests against the compile target and the newest IDE only
#   (-PverifyIdes=quick), on main against the full recommended set (as release.yml does).
# Releases are tag-based: see release.yml.
# The plugin lives in intellij/. Only changes there, in the shared format spec (spec/) or in this workflow run it.

name: Build
on:
  push:
    branches: [ main ]
    paths:
      - 'intellij/**'
      - 'spec/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'intellij/**'
      - 'spec/**'
      - '.github/workflows/build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: intellij

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Prepare Plugin Artifact
        id: artifact
        shell: bash
        run: |
          cd "${{ github.workspace }}/intellij/build/distributions"
          FILENAME="$(ls -- *.zip)"
          unzip "$FILENAME" -d content
          echo "filename=${FILENAME:0:-4}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ./intellij/build/distributions/content/*/*

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Tests
        run: ./gradlew check

      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result
          path: ${{ github.workspace }}/intellij/build/reports/tests

  inspectCode:
    name: Inspect code
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # check out the PR commit, not the merge commit
          fetch-depth: 0  # full history for pull request analysis

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Qodana - Code Inspection
        uses: JetBrains/qodana-action@v2026.2.4
        with:
          cache-default-branch-only: true
          args: --project-dir intellij
          # Inspect the whole project at the PR's commit. PR mode also analyses the base commit, which breaks
          # whenever paths move (the monorepo PR had no intellij/ on its base), and the project is small.
          pr-mode: false

  verify:
    name: Verify plugin
    runs-on: ubuntu-latest
    steps:
      # The verified IDEs need several GB. Removing Android and .NET frees enough. Also removing Haskell, Docker
      # images and swap, as before, took over two minutes.
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: false
          large-packages: false
          docker-images: false
          tool-cache: false
          swap-storage: false

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Read-only: the downloaded IDEs would add ~3 GB to the Gradle cache, and saving that took over a minute and a
      # half per run. The Test and Build jobs keep the shared dependency cache warm.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run Plugin Verification tasks
        run: ./gradlew verifyPlugin ${{ github.event_name == 'pull_request' && '-PverifyIdes=quick' || '' }}

      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/intellij/build/reports/pluginVerifier
