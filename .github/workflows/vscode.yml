# CI for the VS Code extension (vscode/): type-check and tests, including every spec vector. Also guards the
# zero-runtime-dependency rule: no third-party code may parse untrusted clipboard text.

name: VS Code
on:
  push:
    branches: [ main ]
    paths:
      - 'vscode/**'
      - 'spec/**'
      - '.github/workflows/vscode.yml'
  pull_request:
    paths:
      - 'vscode/**'
      - 'spec/**'
      - '.github/workflows/vscode.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: vscode

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22  # for the tooling; the extension itself runs on VS Code's Node (20 in 1.90, covered by the integration job)
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install (no install scripts, see .npmrc)
        run: npm ci

      - name: No runtime dependencies
        run: |
          if [ "$(node -p 'Object.keys(require("./package.json").dependencies || {}).length')" != "0" ]; then
            echo "::error::vscode/package.json has runtime dependencies; the extension must have none"
            exit 1
          fi

      - name: Audit
        run: npm audit --audit-level=low

      - name: Type-check and test
        run: npm run check

      - name: Package and inspect the .vsix
        run: |
          npm run package
          VSIX="$(ls -- *.vsix)"
          unzip -l "$VSIX" | tee "$RUNNER_TEMP/vsix.txt"
          if grep -qE 'node_modules/|/test/|\.ts$|\.map$' "$RUNNER_TEMP/vsix.txt"; then
            echo "::error::the .vsix contains dependencies, tests, sources or source maps"
            exit 1
          fi
          echo "VSIX=$VSIX" >> "$GITHUB_ENV"

      - name: Upload the .vsix
        uses: actions/upload-artifact@v7
        with:
          name: copy-pasta-vsix
          path: vscode/*.vsix

  integration:
    name: Integration (VS Code ${{ matrix.vscode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: [ '1.90.0', 'stable' ]  # the oldest supported, and the current release
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install
        run: npm ci

      - name: Run inside VS Code
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        run: xvfb-run -a npm run test:integration
