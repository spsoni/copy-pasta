# Dependabot configuration:
# https://docs.github.com/en/free-pro-team@latest/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/intellij"
    schedule:
      interval: "weekly"
  # The VS Code extension's dev dependencies (it has no runtime ones)
  - package-ecosystem: "npm"
    directory: "/vscode"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14  # versions at least two weeks old, as for everything else here
  # Packaging and publishing tools (vsce, ovsx), used only by `make vscode-package` and the release workflow
  - package-ecosystem: "npm"
    directory: "/vscode/tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
